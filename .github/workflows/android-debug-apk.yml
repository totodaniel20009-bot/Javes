name: Build personal JARVIS debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: unzip -o ./JARVIS_v0.4.1_fixed.zip -d src041
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: src041
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-0.4.1-beta-debug
          path: src041/app/build/outputs/apk/debug/app-debug.apk
